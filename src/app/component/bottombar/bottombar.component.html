<!-- Not on a phone. There it went to the top of the window, where it pushed the
     mode tabs down by its own height to say what the tabs and the sheet already
     say (issue #298). The mode is the selected tab, and the hints in the status
     line are about a pointer a phone does not have. -->
@if (!viewport.isPhone()) {
  <div data-canvas-inset="bottom" id="bottomBar">
    <span class="mode">{{ modeName }}</span>
    <span class="status" [class.tuning]="statusIsTuning">{{ status }}</span>
    <span class="spacer"></span>
    <!-- Mobility, said in the one place that already reports what the drawing is
       rather than what it is doing. It is the number every refusal in this app
       is really about -- one input drives one degree of freedom -- and it was
       computed here and never rendered. Hidden where there is nothing to say:
       a linkage with nothing grounded has no mobility, and a dash under a
       heading is worse than no heading. -->
    @if (degreesOfFreedom !== '—') {
      <span
        class="dof"
        title="Degrees of freedom. PMKS simulates one input per mechanism, which drives one degree of freedom."
      >
        Degrees of freedom: {{ degreesOfFreedom }}
      </span>
    }
    @if (cursor) {
      <span class="cursor">Cursor: {{ cursor }}</span>
    }
    <!-- A way in as well as a readout: the units are changed in Settings, and
       this is where a reader looks when they are the wrong ones. -->
    <button
      type="button"
      class="units"
      title="Change units in Settings"
      [attr.aria-label]="'Units: ' + unitSet + '. Change them in Settings.'"
      (click)="openUnitSettings()"
    >
      Units: {{ unitSet }}
    </button>
  </div>
}
