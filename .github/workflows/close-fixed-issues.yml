# Closes the issues a pull request fixes when it merges into `staging`.
#
# GitHub closes an issue named by "Fixes #N" only when the pull request merges
# into the default branch, which here is `main`. Fixes merge into `staging`
# and reach `main` weeks later in a release, so a fixed bug stayed open on the
# board all that time. Closing it here lets the board's own "Item closed" rule
# move it to Done.
#
# `pull_request` reads this file from the pull request's own branch, so it
# works for every branch cut from `staging` once it merges there.
# `pull_request_target` would read it from `main` instead, and do nothing
# until a release carried it across. The cost is a pull request from a fork,
# whose token cannot write: close its issues by hand.

name: Close fixed issues

on:
  pull_request:
    types: [closed]
    branches: [staging]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            // The keywords GitHub itself recognizes, naming an issue in this repository.
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;
            const numbers = new Set([...(pr.body ?? '').matchAll(keyword)].map((m) => Number(m[1])));
            for (const issue_number of numbers) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number }));
              } catch (error) {
                // A mistyped or deleted number should not stop the ones after it.
                if (error.status !== 404 && error.status !== 410) throw error;
                core.warning(`#${issue_number} does not exist; skipped`);
                continue;
              }
              if (issue.pull_request || issue.state === 'closed') continue;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `Fixed by #${pr.number}, merged into \`staging\`.`,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed #${issue_number}`);
            }
